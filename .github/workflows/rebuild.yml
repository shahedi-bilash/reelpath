name: Rebuild dynamic content

# Keeps the "Coming Soon" rail (and, as more scripts get added here,
# whatever else needs periodic refreshing) from going stale between
# manual editing sessions. Runs on a schedule, plus a manual button for
# whenever it's needed sooner.
#
# Any change this workflow commits gets pushed straight to main, which
# Cloudflare Pages is already watching -- that push alone is enough to
# trigger a new deploy. No Cloudflare-side config needed here.

on:
  schedule:
    # Daily at 00:00 UTC. GitHub Actions cron can lag by several minutes
    # under load -- that's fine for a once-a-day content refresh.
    - cron: '0 0 * * *'
  workflow_dispatch: {}
    # Manual "Run workflow" button in the Actions tab, for whenever a
    # refresh is needed outside the daily schedule.

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild Coming Soon rail
        shell: pwsh
        env:
          # Set as a repo secret: Settings -> Secrets and variables ->
          # Actions -> New repository secret -> name it TMDB_TOKEN.
          # Never hardcode the token here or anywhere else in the repo.
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: ./scripts/rebuild-coming-soon.ps1

      - name: Rebuild search index
        # ubuntu-latest ships Perl + JSON::PP (both core modules) --
        # nothing to install. Picks up any franchise/list/genre content
        # added since the last run, plus any TMDB poster changes on
        # existing watch-order nodes above.
        run: perl scripts/build-search-index.pl

      # ---- Rating-badge <-> TMDB id backfill (new content only) ----
      # Extract/apply are idempotent and only touch badges that don't
      # already carry a data-tmdb-id, so this safely runs every day but
      # only ever does real work when a franchise guide, list, or genre
      # page gained new entries since the last run.
      - name: Extract rating-badge manifest (new entries only)
        run: perl scripts/sync-rating-ids.pl --extract

      - name: Resolve TMDB ids for new entries
        shell: pwsh
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: ./scripts/resolve-tmdb-ids.ps1

      - name: Apply resolved TMDB ids
        run: perl scripts/sync-rating-ids.pl --apply

      # ---- Daily TMDB rating refresh (existing content) ----
      - name: Refresh TMDB ratings
        shell: pwsh
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: ./scripts/refresh-tmdb-ratings.ps1

      # ---- IMDb rating refresh (weekly-cached inside the script itself
      # via scripts/omdb-cache.json -- safe to invoke daily) ----
      - name: Refresh IMDb ratings (OMDb)
        shell: pwsh
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          # Set as a repo secret alongside TMDB_TOKEN: Settings -> Secrets
          # and variables -> Actions -> New repository secret -> name it
          # OMDB_KEY. Never hardcode it here or anywhere else in the repo.
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: ./scripts/refresh-omdb-ratings.ps1

      # Add further build-time scripts here the same way as more of the
      # site becomes cron-refreshable -- each just needs its own step
      # above this one.

      - name: Commit and push if changed
        run: |
          git config user.name "reelpath-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes -- nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "Auto-rebuild: refresh Coming Soon rail, search index, TMDB/IMDb ratings [skip ci]"
          git push
